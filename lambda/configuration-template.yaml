## Service Name - Tells the Failure Flags Sidecar what name to use when registering
## with Gremlin. It is typically best to let Failure Flags determine this
## automatically rather than setting it explicitly. In some cases this must be set
## explicitly (like when running in Kubernetes or on a VM).
## Override this using SERVICE_NAME
#service_name: default

## Gremlin Team Id - you can find this value at https://app.gremlin.com/settings/teams
## Override this using GREMLIN_TEAM_ID
team_id: ffffffff-ffff-ffff-ffff-ffffffffffff

## Failure Flags Service Labels - Add labels to identify unique deployments.
## Override these using environment variables prefixed with GREMLIN_LABEL_
labels:
    project: failure-flags-examples

## Debug, set to true for enhanced debug logging to STDOUT
## Uncomment to enable debugging
## Override with GREMLIN_DEBUG=true
debug: true

## Trace, set to true for enhanced network tracing to STDOUT
## Uncomment to enable network tracing
## Override with GREMLIN_TRACE=true
#trace: true

##############################################
## Team Certificate - Use One of the Following
##############################################

## Gremlin Team Certificate - Paste certificate content here.
## Override this with GREMLIN_TEAM_CERTIFICATE
team_certificate: |
    -----BEGIN CERTIFICATE-----
    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXX
    -----END CERTIFICATE-----

## Gremlin Team Certificate File Path
## Override this with GREMLIN_TEAM_CERTIFICATE_FILE
#team_certificate_file: "/opt/secrets/gremlin/team-certificate.pem

## Gremlin Team Certificate ARN
## Supports ssm and secretsmanager ARNs
## Override this with GREMLIN_TEAM_CERTIFICATE_ARN
#team_certificate_arn: ""

##############################################
## Team Private Key - Use One of the Following
##############################################

## Gremlin Team Private Key - Paste certificate content here.
## Override this with GREMLIN_TEAM_PRIVATE_KEY
team_private_key: |
    -----BEGIN EC PRIVATE KEY-----
    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==
    -----END EC PRIVATE KEY-----

## Gremlin Team Private Key File Path
## Override this with GREMLIN_TEAM_PRIVATE_KEY_FILE
#team_private_key_file: "/opt/secrets/gremlin/team-privatekey.pem"

## Gremlin Team Private Key ARN
## Supports ssm and secretsmanager ARNs
## Override this with GREMLIN_TEAM_PRIVATE_KEY_ARN
#team_private_key_arn: ""

##############################################
## Corporate Proxy Configuration
##############################################

## HTTPS Proxy, set this when routing outbound Gremlin HTTPS traffic through a proxy
## Override this with HTTPS_PROXY
#https_proxy: https://corp.proxy.internal:3128

## Custom CA Certificate, set this when using a https proxy with a self-signed certificate.
## Override this with GREMLIN_CUSTOM_ROOT_CERTIFICATE
## Paste certificate content here.
#ssl_cert: |
#    -----BEGIN CERTIFICATE-----
#    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXX
#    -----END CERTIFICATE-----

## Override this with GREMLIN_CUSTOM_ROOT_CERTIFICATE_FILE
#ca_cert_file: "/api/secrets/custom-certificate.crt"

## Override this with GREMLIN_CUSTOM_ROOT_CERTIFICATE_FILE
#ca_cert_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

## CA Certificate Bundles
## If you have pre-build certificate bundles you need to use you can provide them 
## via file or ARN. TLS configuration provided via bundle will override the
## ssl_cert parameter. Only ssm and secretsmanager ARNs are supported.

## Override this with GREMLIN_CUSTOM_ROOT_CERTIFICATE_BUNDLE_FILE
#ssl_trust_cert_bundle_file: "/opt/secrets/custom-certificates.crt'

## Override this with GREMLIN_CUSTOM_ROOT_CERTIFICATE_BUNDLE_ARN
#ssl_trust_cert_bundle_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

##############################################
## Enabling Failure Flags by Proxy (modes)
##############################################

## AWS Lambda API Proxy Mode
## -------------------------------------------

## Enables a special proxy for the AWS Lambda Runtime API. This proxy allows
## for simple experimentation on AWS Lambda functions withouut code changes.
## Override with GREMLIN_LAMBDA_PROXY_ENABLED. Value must be `true` or `1`.
lambda_proxy_enabled: true

## This port must match the AWS_LAMBDA_RUNTIME_API value set in your function.
## Make sure to use the included boostratp script. Defaults to localhost:5033.
## Override with GREMLIN_LAMBDA_PROXY_PORT.
#lambda_proxy_port: localhost:5033

## Dependency Proxy Mode
## -------------------------------------------
## This is an HTTP and HTTPS proxy for intercepting calls to your service 
## dependencies. To use this, enable the below and then set the
## GREMLIN_HTTP_PROXY and GREMLIN_HTTPS_PROXY environment variables in your
## service to match the connect proxy port setting below.

## This enables the HTTP CONNECT proxy for automatically intercepting outbound 
## HTTP requests to your service dependencies. Override this value with
## GREMLIN_DEPENDENCY_PROXY_ENABLED and set it to true, yes, or 1
## This defaults to false.
dependency_proxy_enabled: true

## This sets the bind address of the HTTP CONNECT proxy. The proxy will only
## bind on localhost and this value must specify localhost (or 127.0.0.1 or ::1)
## and the port. This defaults to localhost:5034.
## Override this value with GREMLIN_DEPENDENCY_PROXY_ENABLED.
#dependency_proxy_port: localhost:5034

## Ingress Proxy Mode
## -------------------------------------------
## This mode routes inbound traffic to your service.

## Uncomment this property to enable the reverse proxy and begin experimenting
## on inbound requests and responses to those requests without any additinoal
## changes to your application code. Enabling this requires that the next two 
## properties are specified. 
## Override this value with GREMLIN_INGRESS_PROXY_ENABLED=true
#ingress_proxy_enabled: true

## This sets the host:port where this reverse proxy should bind. This must match
## the destination where your existing loadbalancer or callers expect the service
## to be running. This value defaults to :5033
## Override this value with GREMLIN_INGRESS_PROXY_PORT=:9081
#ingress_proxy_port: :5035

## If the reverse proxy is enabled this property must be explicitly set to the
## local endpoint URL of the upstream service. This URL should be on localhost
## to avoid making additional network hops. This value has no default.
## Override this value with GREMLIN_INGRESS_PROXIED_ENDPOINT
#ingress_proxied_endpoint: http://localhost:9080

## Serving TLS from the Ingress Proxy
## -------------------------------------------
##

## Provide a server certificate (or chain) to enable TLS on the ingress proxy.
## Only provide one of the following three properties. Override this value
## from the GREMLIN_INGRESS_SERVICE_CERTIFICATE environment variable.
#ingress_service_certificate: |
#    -----BEGIN CERTIFICATE-----
#    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXX
#    -----END CERTIFICATE-----

## Provide a file name containing a server certificate (or chain) to enable 
## TLS on the ingress proxy. Only provide one of these properties 
## Override this value from the GREMLIN_INGRESS_SERVICE_CERTIFICATE_FILE
## environment variable.
#ingress_service_certificate_file: /path/to/file

## Provide an ARN containing a server certificate (or chain) to enable 
## TLS on the ingress proxy. Only provide one of these properties 
## Override this value from the GREMLIN_INGRESS_SERVICE_CERTIFICATE_ARN
## environment variable.
#ingress_service_certificate_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

## Provide a private key corresponding to the provided TLS server certificate
## (or chain) to enable TLS on the ingress proxy. Only provide one of these
## properties. Override this value from the GREMLIN_INGRESS_SERVICE_PRIVATE_KEY
## environment variable.
#ingress_service_private_key: |
#    -----BEGIN EC PRIVATE KEY-----
#    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==
#    -----END EC PRIVATE KEY-----

## Provide a file name containing a private key corresponding to the
## provided TLS server certificate (or chain) to enable TLS on the ingress
## proxy. Only provide one of these properties. Override this value from the
## GREMLIN_INGRESS_SERVICE_PRIVATE_KEY_FILE environment variable.
#ingress_service_private_key_file: /path/to/file

## Provide an ARN containing a private key corresponding to the provided TLS
## server certificate (or chain) to enable TLS on the ingress proxy. Only
## provide one of these properties. Override this value from the
## GREMLIN_INGRESS_SERVICE_PRIVATE_KEY_ARN environment variable.
#ingress_service_private_key_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

## Common Proxy Settings
## -------------------------------------------

## Uncomment this property to set a custom timeout for idle connections.
### This value is specified using Go duration formats, e.g. 1m, 60s.
## The default value is 2m.
## Override this value with GREMLIN_PROXY_IDLE_TIMEOUT.
#proxy_idle_connection_timeout: "1m"

## Uncomment this property to set a custom read timeout.
## This value is specified using Go duration formats, e.g. 1m, 60s.
## The default value is 2m.
## Override this value with GREMLIN_PROXY_READ_TIMEOUT.
#proxy_read_timeout: "1m"

## Uncomment this property to set a custom write timeout.
## This value is specified using Go duration formats, e.g. 1m, 60s.
## The default value is 2m.
## Override this value with GREMLIN_PROXY_WRITE_TIMEOUT.
#proxy_write_timeout: "1m"

##############################################
## Traversing Outbound Gateways
##############################################
## Some environments include gateways for internet traffic (like to 
## the Gremlin control plane APIs). When such a gateway requires
## mutually authenticated TLS traffic to identify and authorize
## the clients (exfil-protection) use the settings below to 
## provide a client TLS certificate and private key. 

## Override this with GREMLIN_CLIENT_CERTIFICATE
#client_certificate: |
#    -----BEGIN CERTIFICATE-----
#    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXX
#    -----END CERTIFICATE-----

## Override this with GREMLIN_CLIENT_CERTIFICATE_FILE
#client_certificate_file: /path/to/file

## Override this with GREMLIN_CLIENT_CERTIFICATE_ARN
#client_certificate_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

## Override this with GREMLIN_CLIENT_PRIVATE_KEY
#client_private_key: |
#    -----BEGIN EC PRIVATE KEY-----
#    ExampleXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==
#    -----END EC PRIVATE KEY-----

## Override this with GREMLIN_CLIENT_PRIVATE_KEY_FILE
#client_private_key_file: /path/to/file

## Override this with GREMLIN_CLIENT_PRIVATE_KEY_ARN
#client_private_key_arn: "arn:aws:secretsmanager:<region>:<aws_account_id>:secret:<secret-name>"

##############################################
## Timing, Ports, and Other Configuration
##############################################

## Refresh Interval controls how offten the sidecar reaches
## out to the control plane. This also controls how long
## experiments remain in local cache. A shorter interval means
## more responsive experiment pickup and halting, but much
## more outbound traffic and resource usage. The default for
## this setting is 30s. This value is a Go duration format
## (e.g. 30s, 1m, 1m30s).
## Override this with GREMLIN_REFRESH_INTERVAL
#refresh_interval: 30s

## Request Timeout controls how long this sidecar will wait during requests
## to external services. This is important to tune because this program
## will not serve experiments until it is able to reach a control plane and
## retrieve the current set. If it is unable to reach a control plane before
## the timeout, then no experiments will be active until the next time it is
## able to reach a control plane. However, in some cases the service itself 
## may not become healthy or yield to the Application until the first
## successful registration (this is a Lambda cold start problem).
## Override this with GREMLIN_REQUEST_TIMEOUT
#request_timeout: 500ms

## API ENDPOINT, set this to the Gremlin API endpoint you want to interact with.
## The default and GA endpoint is at https://api.gremlin.com/v1/ff. You may need
## to set this if you're using Gremlin Private Edition or working with custom
## endpoints (something like Private Link).
## Override this with GREMLIN_API_ENDPOINT_URL
#api_endpoint_url: https://api.gremlin.com/v1/ff
