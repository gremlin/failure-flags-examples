plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.gremlin.com/'
    }
}

// Compile to Java 17 bytecode so the example builds on any JDK 17 or newer.
// The function itself is deployed to the java21 Lambda runtime.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.4.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'com.gremlin:failure-flags-java:1.2'
}

tasks.register('buildZip', Zip) {
    archiveBaseName = 'demo'
    from compileJava
    from processResources
    into('lib') {
        from jar
        from configurations.runtimeClasspath
    }
}

tasks.named('build') {
    dependsOn 'buildZip'
}
